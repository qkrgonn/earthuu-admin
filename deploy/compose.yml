name: earthuu-admin

services:
  db-tls-init:
    image: alpine:3.22
    restart: "no"
    command: >-
      sh -c 'cp /source/ca.crt /source/server.crt /source/server.key /target/ &&
      chown 70:70 /target/server.crt /target/server.key &&
      chmod 644 /target/ca.crt /target/server.crt && chmod 600 /target/server.key'
    volumes:
      - ./secrets/db:/source:ro
      - db-tls:/target

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/db-tls/server.crt
      - -c
      - ssl_key_file=/run/db-tls/server.key
      - -c
      - ssl_ca_file=/run/db-tls/ca.crt
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - db-tls:/run/db-tls:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    depends_on:
      db-tls-init:
        condition: service_completed_successfully
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}?sslmode=verify-full&sslrootcert=/run/db-tls/ca.crt
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_FRONTEND_ORIGIN: https://${DOMAIN}
      SESSION_COOKIE_SECURE: "true"
      SWAGGER_ENABLED: "false"
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./secrets/db/ca.crt:/run/db-tls/ca.crt:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  frontend:
    build: ../frontend
    restart: unless-stopped
    networks: [internal]
    logging: *logging

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?required}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on: [backend, frontend]
    networks: [internal]
    logging: *logging

  certbot:
    image: certbot/certbot:v5.1.0
    ports:
      - "80:80"
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    profiles: [tools]

networks:
  internal:
    internal: true

volumes:
  postgres-data:
  certbot-webroot:
  db-tls:
